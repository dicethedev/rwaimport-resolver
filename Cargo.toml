[package]
name = "rwaimport-resolver"
version = "0.1.0"
edition = "2021"
publish = false
description = "Contract identification and selected on-chain claim verification for RWAimport"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "serde"] }
hex = "0.4.3"
jsonschema = { version = "0.33", default-features = false }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
sha3 = "0.10.9"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
